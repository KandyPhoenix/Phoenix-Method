name: Refresh Portal Stats

# Pulls last month's GSC (+ GA4 for Lori) actuals into every portal's
# data.json on the 1st of the month, commits to main, and syncs the data to
# Cloudflare KV. Can also be run any time from the Actions tab.
#
# Requires repository secrets:
#   GSC_CREDENTIALS      — JSON contents of the GSC service-account key
#                          (locally: C:\Users\kandy\Work\config\gsc-credentials.json)
#   CLOUDFLARE_API_TOKEN — already set (used by deploy-portal.yml)
#
# KV is synced here directly because pushes made with the workflow's
# GITHUB_TOKEN do not trigger deploy-portal.yml.

on:
  schedule:
    - cron: '17 13 1 * *' # 1st of each month, 13:17 UTC (~8:17am Central)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check GSC credentials secret
        env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
        run: |
          if [ -z "$GSC_CREDENTIALS" ]; then
            echo "::error::GSC_CREDENTIALS secret is not set. Add the JSON contents of gsc-credentials.json as a repository secret named GSC_CREDENTIALS (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet google-auth google-api-python-client requests

      - name: Pull last month's stats into portal data
        env:
          GSC_CREDENTIALS: ${{ secrets.GSC_CREDENTIALS }}
        run: python scripts/refresh_portal_stats_ci.py

      - name: Commit refreshed data to main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- workers/portal/public; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No stat changes to commit."
          else
            MONTH_LABEL=$(date -u -d "$(date -u +%Y-%m-01) -1 day" '+%B %Y')
            git add workers/portal/public/*/data.json
            git commit -m "Portal stats refresh: ${MONTH_LABEL} GSC/GA4 actuals [automated]"
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync data.json files to PORTAL_DATA KV
        if: steps.commit.outputs.changed == 'true'
        working-directory: workers/portal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d3aefe8ad2b7a8399b3f47238cde9599
        run: |
          npx wrangler kv key put --binding=PORTAL_DATA "lori" --path="public/lori/data.json"
          npx wrangler kv key put --binding=PORTAL_DATA "phw" --path="public/phw/data.json"
          npx wrangler kv key put --binding=PORTAL_DATA "pm" --path="public/pm/data.json"
          npx wrangler kv key put --binding=PORTAL_DATA "sunbright" --path="public/sunbright/data.json"
