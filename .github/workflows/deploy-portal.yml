name: Deploy Portal

on:
  push:
    branches: [main]
    paths:
      - 'workers/portal/**'
      - '.github/workflows/deploy-portal.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Portal Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d3aefe8ad2b7a8399b3f47238cde9599
          workingDirectory: workers/portal

      - name: Sync data.json files to PORTAL_DATA KV
        working-directory: workers/portal
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: d3aefe8ad2b7a8399b3f47238cde9599
        run: |
          npx wrangler kv key put --binding=PORTAL_DATA "lori" --path="public/lori/data.json" --remote
          npx wrangler kv key put --binding=PORTAL_DATA "phw" --path="public/phw/data.json" --remote
          npx wrangler kv key put --binding=PORTAL_DATA "pm" --path="public/pm/data.json" --remote
