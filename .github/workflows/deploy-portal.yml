name: Deploy Portal

on:
  push:
    branches: [main]
    paths:
      - 'workers/portal/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers
    steps:
      - uses: actions/checkout@v4

      - name: Deploy Portal Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: d3aefe8ad2b7a8399b3f47238cde9599
          workingDirectory: workers/portal
