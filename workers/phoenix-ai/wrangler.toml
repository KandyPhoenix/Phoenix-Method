name = "phoenix-ai"
main = "src/worker.js"
compatibility_date = "2026-01-01"
workers_dev = true

# Phoenix AI — SEO content autopilot SaaS.
# Public sign-up worker; one customer per email. Each customer connects one or
# more WordPress sites. The cron triggers daily article generation (added in
# Phase 2). Phase 1 supports manual on-demand generation via the dashboard.

[vars]
FROM_EMAIL = "phoenix-ai@phoenixmethodseo.com"
FROM_NAME = "Phoenix AI"
SESSION_DAYS = "30"
DEFAULT_PLAN = "trial"
TRIAL_DAYS = "7"

# KV namespaces. Created via `wrangler kv namespace create PHOENIX_AI_<NAME>`.
# Binding names below intentionally match the worker code; titles in Cloudflare
# are prefixed PHOENIX_AI_ for tidiness in the dashboard.

[[kv_namespaces]]
binding = "CUSTOMERS"
id = "28889f7d43d945b5a01c039749e6519b"

[[kv_namespaces]]
binding = "SITES"
id = "32003724561b4715a1bdab9558c661e0"

[[kv_namespaces]]
binding = "KEYWORDS"
id = "c75103a4ce514ab38508794a5e322b66"

[[kv_namespaces]]
binding = "ARTICLES"
id = "f5c8e1a1be5646a28f1b3a9807e8bc7d"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "8c0eb4d5d78d49cea60a33447fdb6036"

[[kv_namespaces]]
binding = "AUDIT_LOG"
id = "2a9794fd305f43ce96c2d116562c61ad"

# Daily cron — picks the next keyword for each active customer/site and runs
# the pipeline. Wired up in Phase 2; harmless to leave defined.
[triggers]
crons = ["0 13 * * *"]

# Secrets (set via `wrangler secret put` after first deploy):
#   SESSION_SECRET       HMAC key for signing session + magic-link tokens
#   RESEND_API_KEY       Magic-link email delivery
#   AI_API_KEY           Article generation API key
#   AI_API_URL           Article generation API endpoint URL
#   AI_API_VERSION       Optional version header value (provider-specific)
#   AI_MODEL_ID          Article generation model identifier
#   AHREFS_API_KEY       Keyword research (Ahrefs API v3)
