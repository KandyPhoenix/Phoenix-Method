<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal | Phoenix Method</title>
    <meta name="description" content="Sign in to your Phoenix Method client portal.">
    <link rel="canonical" href="https://phoenixmethodseo.com/portal/">
    <meta name="robots" content="noindex, nofollow">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
    <link rel="manifest" href="/site.webmanifest">
    <meta name="theme-color" content="#FF4D00">
    <meta http-equiv="refresh" content="0; url=https://portal.phoenixmethod.workers.dev/">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Outfit:wght@200;300;400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Outfit:wght@200;300;400;500;600&display=swap"></noscript>
    <style>
        :root {
            --font-display: 'Cinzel', serif;
            --font-accent: 'Rajdhani', sans-serif;
            --font-body: 'Outfit', sans-serif;
            --bg-deep: #07070D;
            --bg-card: #131320;
            --fire-start: #FF4D00;
            --fire-mid: #FF8C00;
            --fire-end: #FFB800;
            --text-primary: #F0EDE6;
            --text-secondary: #A8A49C;
            --text-muted: #6B6860;
            --border: rgba(255,255,255,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-body); background: var(--bg-deep); color: var(--text-primary); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 20px; line-height: 1.6; }
        a { color: var(--fire-mid); text-decoration: none; transition: color .2s; }
        a:hover { color: var(--fire-end); }
        .card { max-width: 480px; width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 44px 36px; text-align: center; }
        .tag { display: inline-block; font-family: var(--font-accent); font-weight: 600; font-size: 0.72rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--fire-mid); margin-bottom: 16px; }
        h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(1.7rem, 4.5vw, 2.2rem); line-height: 1.2; margin-bottom: 14px; }
        .fire-text { background: linear-gradient(135deg, var(--fire-start), var(--fire-mid), var(--fire-end)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .lede { color: var(--text-secondary); font-size: 1rem; margin-bottom: 28px; }
        .btn { display: inline-block; padding: 14px 32px; border-radius: 8px; background: linear-gradient(135deg, var(--fire-start), var(--fire-mid)); color: #fff; font-family: var(--font-accent); font-weight: 700; font-size: 0.95rem; letter-spacing: 0.12em; text-transform: uppercase; transition: transform .15s, box-shadow .2s; }
        .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(255,140,0,0.25); color: #fff; }
        .fallback { margin-top: 22px; font-size: 0.85rem; color: var(--text-muted); }
        .fallback a { color: var(--text-secondary); }
        .fallback a:hover { color: var(--fire-mid); }
        .redirect-note { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--border); font-family: var(--font-accent); font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); }
    </style>
</head>
<body>
    <div class="card">
        <span class="tag">Client Portal</span>
        <h1>Sign in to your <span class="fire-text">portal</span></h1>
        <p class="lede">You're being redirected to the secure sign-in page. If it doesn't load in a moment, use the button below.</p>
        <p><a href="https://portal.phoenixmethod.workers.dev/" class="btn">Go to Sign-in &rarr;</a></p>
        <p class="fallback">Don't have portal access? <a href="mailto:hello@phoenixmethodseo.com">Contact Phoenix Method</a></p>
        <p class="redirect-note">Redirecting&hellip;</p>
    </div>
    <script>
        // Client-side redirect fallback (meta refresh runs immediately; this is a safety net).
        setTimeout(function () { window.location.replace('https://portal.phoenixmethod.workers.dev/'); }, 1200);
    </script>
</body>
</html>
